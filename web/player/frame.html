<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live player</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; font: 12px/1.4 system-ui, sans-serif; }
    #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .loading { opacity: .6; letter-spacing: .04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading live player…</div></div>
  <!-- The product's standalone player (React 18 + Remotion + federation), vendored by `npm run build:player`. -->
  <script src="iframe-bootstrap.js"></script>
  <script>

    // The product's platform font CSS (Wix, Madefor, Google, Helvetica @font-face rules), which its
    // own hosts load before any text renders — without it text falls back to system fonts.
    function loadPlatformFonts() {
      return fetch('fonts.json').then(function (r) { return r.json(); }).catch(function () { return []; }).then(function (urls) {
        return Promise.all(urls.map(function (href) {
          return new Promise(function (resolve) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href;
            l.onload = l.onerror = resolve;
            document.head.appendChild(l);
          });
        }));
      });
    }
    (function () {
      var root = document.getElementById('root');
      if (!window.WixelPlayerFrame) { root.innerHTML = '<div class="loading">Live player not built — run npm run build:player</div>'; return; }
      loadPlatformFonts().then(function () { window.WixelPlayerFrame.mount(root); });
    })();
  </script>
</body>
</html>
