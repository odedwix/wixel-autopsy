<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Exact capture</title>
  <style>html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; } #root { width: 100vw; height: 100vh; }</style>
</head>
<body>
  <!-- Driven by server/exact.js in headless Chrome: mounts the product player for one run and
       exposes a frame-by-frame handle (AutopsyCapture, built by npm run build:player). -->
  <div id="root"></div>
  <script src="/player/capture-bootstrap.js"></script>
  <script>

    // The product's platform font CSS (Wix, Madefor, Google, Helvetica @font-face rules), which its
    // own hosts load before any text renders — without it text falls back to system fonts.
    function loadPlatformFonts() {
      return fetch('/player/fonts.json').then(function (r) { return r.json(); }).catch(function () { return []; }).then(function (urls) {
        return Promise.all(urls.map(function (href) {
          return new Promise(function (resolve) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href;
            l.onload = l.onerror = resolve;
            document.head.appendChild(l);
          });
        }));
      });
    }
    (async function () {
      var q = new URLSearchParams(location.search);
      try {
        await loadPlatformFonts();
        if (!window.AutopsyCapture) throw new Error('capture bundle not built — run npm run build:player');
        var input = await fetch('/api/player-input/' + q.get('run') + '?captions=' + (q.get('captions') || 'user') + (q.get('root') ? '&root=' + q.get('root') : '')).then(function (r) {
          if (!r.ok) throw new Error('player input ' + r.status);
          return r.json();
        });
        window.__captureMeta = await window.AutopsyCapture.mount(document.getElementById('root'), input);
      } catch (e) {
        window.__captureError = String((e && e.message) || e);
      }
    })();
  </script>
</body>
</html>
